openapi: 3.0.0
info:
  title: API de Preventas (openspec)
  description: Especificaciones de la API para el sistema de gestión de preventas.
  version: 1.0.0
servers:
  - url: http://sanluiscloud.ddns.net/ords/sanluiscloud/mobile
    description: Servidor de Desarrollo Oracle ORDS
paths:
  /login:
    post:
      summary: Autenticación de usuario
      description: Permite a los usuarios iniciar sesión en la aplicación.
      responses:
        '200':
          description: Inicio de sesión exitoso
        '401':
          description: Credenciales inválidas
  /productos:
    get:
      summary: Listar productos
      description: Obtiene la lista de productos disponibles para la preventa.
      responses:
        '200':
          description: Lista de productos obtenida con éxito
  /clientes:
    get:
      summary: Listar clientes
      description: Obtiene la lista de clientes asignados al preventista desde Oracle ORDS.
      responses:
        '200':
          description: Lista de clientes obtenida con éxito
          content:
            application/json:
              example:
                items: []
                hasMore: false
                limit: 25
                offset: 0
                count: 0
                links:
                  - rel: "self"
                    href: "http://sanluiscloud.ddns.net/ords/sanluiscloud/mobile/clientes"
                  - rel: "describedby"
                    href: "http://sanluiscloud.ddns.net/ords/sanluiscloud/metadata-catalog/mobile/item"
                  - rel: "first"
                    href: "http://sanluiscloud.ddns.net/ords/sanluiscloud/mobile/clientes"
  /pedidos:
    get:
      summary: Consultar lista de pedidos
      description: Obtiene la lista paginada de pedidos registrados desde Oracle ORDS.
      responses:
        '200':
          description: Lista de pedidos obtenida con éxito
          content:
            application/json:
              example:
                items: []
                hasMore: false
                limit: 25
                offset: 0
                count: 0
                links:
                  - rel: "self"
                    href: "http://sanluiscloud.ddns.net/ords/sanluiscloud/mobile/pedidos"
                  - rel: "describedby"
                    href: "http://sanluiscloud.ddns.net/ords/sanluiscloud/metadata-catalog/mobile/item"
                  - rel: "first"
                    href: "http://sanluiscloud.ddns.net/ords/sanluiscloud/mobile/pedidos"
    post:
      summary: Crear nuevo pedido
      description: Registra un nuevo pedido en el sistema central.
      responses:
        '201':
          description: Pedido creado con éxito
        '400':
          description: Error en los datos del pedido
  /catalogo:
    get:
      summary: Consultar catálogo de productos
      description: Obtiene el catálogo paginado de productos desde Oracle ORDS.
      responses:
        '200':
          description: Respuesta de catálogo paginada obtenida con éxito
          content:
            application/json:
              example:
                items: []
                hasMore: false
                limit: 25
                offset: 0
                count: 0
                links:
                  - rel: "self"
                    href: "http://sanluiscloud.ddns.net/ords/sanluiscloud/mobile/catalogo"
                  - rel: "describedby"
                    href: "http://sanluiscloud.ddns.net/ords/sanluiscloud/metadata-catalog/mobile/item"
                  - rel: "first"
                    href: "http://sanluiscloud.ddns.net/ords/sanluiscloud/mobile/catalogo"
  /faltantes:
    get:
      summary: Consultar productos faltantes
      description: Obtiene la lista paginada de productos o artículos faltantes desde Oracle ORDS.
      responses:
        '200':
          description: Lista de faltantes obtenida con éxito
          content:
            application/json:
              example:
                items: []
                hasMore: false
                limit: 25
                offset: 0
                count: 0
                links:
                  - rel: "self"
                    href: "http://sanluiscloud.ddns.net/ords/sanluiscloud/mobile/faltantes"
                  - rel: "describedby"
                    href: "http://sanluiscloud.ddns.net/ords/sanluiscloud/metadata-catalog/mobile/item"
                  - rel: "first"
                    href: "http://sanluiscloud.ddns.net/ords/sanluiscloud/mobile/faltantes"
# Aquí se añadirán más rutas según la evolución del proyecto.
