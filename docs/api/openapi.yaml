openapi: 3.0.0
info:
  title: API de Preventas (openspec)
  description: Especificaciones de la API para el sistema de gestión de preventas.
  version: 1.0.0
servers:
  - url: http://sanluiscloud.ddns.net/ords/sanluiscloud/mobile
    description: Servidor de Desarrollo Oracle ORDS
paths:
  /login:
    post:
      summary: Autenticación de usuario
      description: Permite a los usuarios iniciar sesión en la aplicación.
      responses:
        '200':
          description: Inicio de sesión exitoso
        '401':
          description: Credenciales inválidas
  /productos:
    get:
      summary: Listar productos
      description: Obtiene la lista de productos disponibles para la preventa.
      responses:
        '200':
          description: Lista de productos obtenida con éxito
  /clientes:
    get:
      summary: Listar clientes
      description: Obtiene la lista de clientes asignados al preventista.
      responses:
        '200':
          description: Lista de clientes obtenida con éxito
  /pedidos:
    post:
      summary: Crear nuevo pedido
      description: Registra un nuevo pedido en el sistema central.
      responses:
        '201':
          description: Pedido creado con éxito
        '400':
          description: Error en los datos del pedido
# Aquí se añadirán más rutas según la evolución del proyecto.
